<pattern
  id="warning"
  width="12"
  height="12"
  patternUnits="userSpaceOnUse"
  patternTransform="rotate(45 50 50)"
>
  <line class="line0" stroke-width="6px" x1="3" x2="3" y2="12" />
  <line class="line1" stroke-width="6px" x1="9" x2="9" y2="12" />
</pattern>
<filter
  id="focus-ring"
  x="-20%"
  y="-20%"
  width="140%"
  height="140%"
  color-interpolation-filters="sRGB"
  ><feMorphology in="SourceAlpha" operator="dilate" radius="3" result="grown" />
  <feComposite in="grown" in2="SourceAlpha" operator="out" result="ring" />
  <feFlood style="flood-color: var(--accent)" result="color" />
  <feComposite in="color" in2="ring" operator="in" result="colored-ring" />
  <feMerge>
    <feMergeNode in="colored-ring" />
    <feMergeNode in="SourceGraphic" />
  </feMerge>
</filter>
<filter
  id="collapsed-outline"
  x="-50%"
  y="-50%"
  width="200%"
  height="200%"
  color-interpolation-filters="sRGB"
  ><feOffset in="SourceGraphic" dx="4" dy="4" result="copy1" />
  <feComponentTransfer in="copy1" result="faded-copy1">
    <feFuncA type="linear" slope="0.5" />
  </feComponentTransfer>

  <feOffset in="SourceGraphic" dx="8" dy="8" result="copy2" />
  <feComponentTransfer in="copy2" result="faded-copy2">
    <feFuncA type="linear" slope="0.25" />
  </feComponentTransfer>

  <feMerge>
    <feMergeNode in="faded-copy2" />
    <feMergeNode in="faded-copy1" />
    <feMergeNode in="SourceGraphic" />
  </feMerge>
</filter>
